<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проекты — мейнфрейм</title>
<style>
  :root{
    --bg:#04100a; --fg:#00ff66; --accent:#00ff66;
    --border:#0a8a3a; --panel:rgba(0,20,8,0.35);
    --wait:#4a8a5a; --dim:#0a8a3a; --red:#ff3b3b;
  }
  *{box-sizing:border-box}
  body{
    font:14px/1.55 "Consolas","Courier New",monospace;color:var(--fg);
    background:
      repeating-linear-gradient(0deg,
        rgba(0,255,102,0.03) 0px,
        rgba(0,255,102,0.03) 1px,
        transparent 1px, transparent 3px),
      radial-gradient(ellipse at center,#0d1a0d 0%,#04100a 60%,#000 100%);
    min-height:100vh;margin:0;padding:18px 22px;
    text-shadow:0 0 6px rgba(0,255,102,0.45);
  }
  .head{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px;
  }
  .head h1{font-size:18px;letter-spacing:2px;margin:0;
           text-shadow:0 0 10px rgba(0,255,102,0.7)}
  .head .crumb{font-size:12px;color:var(--wait);text-shadow:none}
  .btn-back{
    background:transparent;color:var(--fg);border:1px solid var(--border);
    font-family:inherit;font-size:11px;letter-spacing:2px;
    padding:5px 12px;cursor:pointer;
    text-shadow:0 0 6px rgba(0,255,102,0.55);
  }
  .btn-back:hover{background:rgba(0,255,102,0.1);border-color:var(--fg)}

  .list-wrap{display:block}
  .list{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:12px;
  }
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:14px;cursor:pointer;
    transition:border-color .2s,box-shadow .2s;
    box-shadow:inset 0 0 20px rgba(0,255,102,0.04);
  }
  .card:hover{
    border-color:var(--fg);
    box-shadow:inset 0 0 30px rgba(0,255,102,0.08),0 0 14px rgba(0,255,102,0.25);
  }
  .card h2{font-size:15px;margin:0 0 6px 0;color:var(--fg);
           letter-spacing:1px;text-shadow:0 0 8px rgba(0,255,102,0.6)}
  .card .meta{font-size:12px;color:var(--wait);text-shadow:none}
  .card .arrow{margin-top:8px;font-size:12px;color:var(--accent);
               text-shadow:0 0 6px rgba(0,255,102,0.5)}
  .empty{color:var(--wait);font-style:italic;padding:14px}
  .err{color:var(--red)}

  .roadmap{display:none;flex-direction:column;height:calc(100vh - 80px);min-height:0}
  .roadmap iframe{flex:1;width:100%;border:1px solid var(--border);background:#04100a}
  body.view-roadmap .list-wrap{display:none}
  body.view-roadmap .roadmap{display:flex}
</style>
</head>
<body>

  <div class="head">
    <h1 id="hTitle">Проекты</h1>
    <div class="crumb" id="crumb"></div>
  </div>

  <div class="list-wrap" id="listWrap">
    <div id="list" class="list">
      <div class="empty">Загружаю список проектов…</div>
    </div>
  </div>

  <div class="roadmap" id="roadmapView">
    <iframe id="roadmapFrame" src="about:blank" title="Роадмап"></iframe>
  </div>

<script>
const state = { projects: [] };

function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

async function loadProjects(){
  const box = $("list");
  try {
    const r = await fetch("/api/projects", {cache:"no-store"});
    const d = await r.json();
    if (!d.ok || !d.projects || !d.projects.length){
      box.innerHTML = '<div class="empty">Проектов с ROADMAP.html не найдено.</div>';
      return;
    }
    state.projects = d.projects;
    box.innerHTML = "";
    for (const p of d.projects){
      const el = document.createElement("div");
      el.className = "card";
      el.dataset.name = p.name;
      const dt = new Date(p.mtime * 1000);
      const mtime = dt.toLocaleString("ru-RU", {hour12:false});
      const size = Math.round(p.size/1024) + " КБ";
      el.innerHTML =
        '<h2>' + escapeHtml(p.title) +
        ' <span class="meta">(' + escapeHtml(p.name) + ')</span></h2>' +
        (p.description ? '<div class="meta">' + escapeHtml(p.description) + '</div>' : '') +
        '<div class="meta">обновлён: ' + mtime + ' · ' + size + '</div>' +
        '<div class="arrow">→ открыть роадмап</div>';
      el.addEventListener("click", () => {
        location.hash = "#/roadmap/" + encodeURIComponent(p.name);
      });
      box.appendChild(el);
    }
  } catch(e){
    box.innerHTML = '<div class="empty err">Ошибка загрузки: ' +
                    escapeHtml(String(e)) + '</div>';
  }
}

function render(){
  const h = location.hash || "";
  const m = h.match(/^#\/roadmap\/(.+)$/);
  if (m){
    const name = decodeURIComponent(m[1]);
    const p = state.projects.find(x => x.name === name);
    if (p){
      $("hTitle").textContent = p.title || p.name;
      $("crumb").innerHTML = '<button class="btn-back" id="btnBack">← К СПИСКУ</button>';
      $("btnBack").onclick = () => { location.hash = "#/list"; };
      const frame = $("roadmapFrame");
      const want = "/roadmap/" + encodeURIComponent(name);
      if (frame.dataset.src !== want){
        frame.src = want;
        frame.dataset.src = want;
      }
      document.body.classList.add("view-roadmap");
      return;
    }
  }
  $("hTitle").textContent = "Проекты";
  $("crumb").innerHTML = "";
  const frame = $("roadmapFrame");
  if (frame.dataset.src){
    frame.src = "about:blank";
    frame.dataset.src = "";
  }
  document.body.classList.remove("view-roadmap");
}

window.addEventListener("hashchange", render);

(async () => {
  await loadProjects();
  render();
})();
</script>
</body>
</html>
